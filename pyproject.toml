[project]
name = "gantry"
version = "0.1.0"
description = "Python environment for Gantry"
authors = [
    { name = "Demizo", email = "demizodemazo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "breathe>=4.36.0",
    "jinja2>=3.1.6",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-mermaid>=2.0.1",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"
