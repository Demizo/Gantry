# EXAMPLE: The stow can be broken apart into separate fragments for organization.
# This fragment contains BLE related items. It is included in CMakeLists.txt via gantry_stow_add_fragment().

enums:
  BleConnectionState:
    description: "Bluetooth Connection State"
    values:
      - name: DISCONNECTED
        value: 0
      - name: CONNECTED
        value: 1

categories:
  - General
  - BLE

items:
  - name: DeviceName
    description: "The name of the device"
    categories: [General]
    type: STRING
    storage: PERSISTENT
    permissions:
      - read: ANY
      - write: [Session]
    default: "BleDevice"
    constraints:
      - min_len: 3
      - max_len: 25

  - name: BleConnectionState
    description: "The current BLE connection state"
    categories: [General, BLE]
    type: ENUM
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: [Session]
    default: DISCONNECTED
    constraints:
      - enum: BleConnectionState
