[project]
name = "example-app-tests"
version = "0.1.0"
description = "Integration tests for example_app"
requires-python = ">=3.13"
dependencies = [
    "stow-client",
    "ruff>=0.15.14",
    "pyserial-asyncio>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv.sources]
stow-client = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
