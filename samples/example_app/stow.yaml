# ==============================================================================
# Enumerations
# ==============================================================================
enums:
  BleConnectionState:
    description: "Bluetooth Connection State"
    values:
      - name: DISCONNECTED
        value: 0
      - name: CONNECTED
        value: 1

  Toggle:
    description: "A toggle to enable or disable"
    values:
      - name: DISABLED
        value: 0
      - name: ENABLED
        value: 1

# ==============================================================================
# Structures
# ==============================================================================
structs:
  - name: CustomType
    description: "A custom type containing text and a number"
    fields:
      - name: Text
        type: STRING
        constraints:
          - min_len: 1
          - max_len: 24
      - name: Number
        type: INT
        constraints:
          - min: 0
          - max: 256

# ==============================================================================
# Roles
# ==============================================================================
roles:
  - Session

# ==============================================================================
# Categories
# ==============================================================================
categories:
  - General
  - BLE
  - Test

# ==============================================================================
# Items
# ==============================================================================
items:
  - name: DeviceName
    description: "The name of the device"
    categories: [General]
    type: STRING
    storage: PERSISTENT
    permissions:
      - read: ANY
      - write: [Session]
    default: "Gantry"
    constraints:
      - min_len: 3
      - max_len: 25

  - name: SerialNumber
    description: "The device serial number"
    categories: [General]
    type: STRING
    storage: TOFU
    permissions:
      - read: ANY
      - write: INTERNAL
    default: "0000000000000000"
    constraints:
      - min_len: 16
      - max_len: 16

  - name: BleConnectionState
    description: "The current BLE connection state"
    categories: [General, BLE]
    type: ENUM
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: [Session]
    default: DISCONNECTED
    constraints:
      - enum: BleConnectionState

  - name: TestEnum
    description: "Test enum value"
    categories: [Test]
    type: ENUM
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: ANY
    default: DISABLED
    constraints:
      - enum: Toggle

  - name: TestInt
    description: "Test int value"
    categories: [Test]
    type: INT
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: ANY
    default: 0
    constraints:
      - min: -100
      - max: 100

  - name: TestFloat
    description: "Test float value"
    categories: [Test]
    type: FLOAT
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: ANY
    default: 21.5
    constraints:
      - min: 15.0
      - max: 30.0

  - name: TestBytes
    description: "Test bytes"
    categories: [Test]
    type: BYTE_ARRAY
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: ANY
    default:
      [0xDE, 0xAD, 0xBE, 0xEF, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x01]
    constraints:
      - min_len: 12
      - max_len: 12

  - name: TestBuffer
    description: "Test buffer"
    categories: [Test]
    type: BUFFER
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: ANY
    default: []
    constraints:
      - min_len: 0
      - max_len: 512

  - name: TestStruct
    description: "Test struct"
    categories: [Test]
    type: STRUCT
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: ANY
    default:
      - field: Text
        value: "Test"
      - field: Number
        value: 0
    constraints:
      - struct: CustomType
