# Generic configuration
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_GPIO=y

CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_DEBUG=y
CONFIG_NO_OPTIMIZATIONS=n
CONFIG_SIZE_OPTIMIZATIONS=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_BACKEND_RTT=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_UART=n

# Enable the Gantry library
CONFIG_GANTRY=y

# Run Gantry's cppcheck configuration against the application source. Leave this off when using our own analysis configuration.
CONFIG_GANTRY_ANALYSIS_CPPCHECK=y
# Run analysis against the library. This is enabled for internal module development to validate the library.
CONFIG_GANTRY_ANALYSIS_CHECK_LIBRARY=y

# Stow Dependencies
CONFIG_ZCBOR=y
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Enable the Stow
CONFIG_GANTRY_STOW=y

# Stow protocol dependencies
CONFIG_COBS=y

# Enable the Stow Protocol
CONFIG_STOW_PROTOCOL=y

# UART
CONFIG_POLL=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=25
CONFIG_BT_DEVICE_NAME="Gantry"
CONFIG_BT_EXT_ADV=y
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=191
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247

# COBS framer
CONFIG_GANTRY_COBS_FRAMER=y

# Memory
CONFIG_GANTRY_MEMORY=y

# Optional memory debugging
CONFIG_MEM_TRACE=n
CONFIG_MEM_WATERMARK=n

# Memory Pools
CONFIG_MEM_POOL_COUNT=3
CONFIG_MEM_POOL1_BLOCK_SIZE=16
CONFIG_MEM_POOL1_BLOCK_COUNT=128
CONFIG_MEM_POOL2_BLOCK_SIZE=128
CONFIG_MEM_POOL2_BLOCK_COUNT=64
CONFIG_MEM_POOL3_BLOCK_SIZE=1024
CONFIG_MEM_POOL3_BLOCK_COUNT=16
