# Gantry, with a Stow server and a Stow client
CONFIG_GANTRY=y
CONFIG_GANTRY_MODULE=y
CONFIG_GANTRY_EVENTS=y
CONFIG_GANTRY_STOW=y
CONFIG_STOW_PROTOCOL=y
CONFIG_STOW_CLIENT=y
CONFIG_STOW_CLIENT_TIMEOUT_MS=1000
CONFIG_STOW_COBS_TRANSPORT=y
CONFIG_ZCBOR=y

# Every item is ephemeral
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NONE=y

CONFIG_GANTRY_MEMORY=y
CONFIG_MEM_POOL_COUNT=3
CONFIG_MEM_POOL1_BLOCK_SIZE=16
CONFIG_MEM_POOL1_BLOCK_COUNT=64
CONFIG_MEM_POOL2_BLOCK_SIZE=128
CONFIG_MEM_POOL2_BLOCK_COUNT=32
CONFIG_MEM_POOL3_BLOCK_SIZE=512
CONFIG_MEM_POOL3_BLOCK_COUNT=8

# The link to the peer
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
CONFIG_POLL=y

# A console with one parseable line per result or event
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART=""
CONFIG_SHELL_ECHO_STATUS=n
CONFIG_SHELL_VT100_COLORS=n
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
