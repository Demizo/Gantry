# ==============================================================================
# Enumerations
# ==============================================================================
enums:
  Color:
    description: "A color selection"
    values:
      - name: RED
        value: 0
      - name: GREEN
        value: 1
      - name: BLUE
        value: 2

# ==============================================================================
# Structures
# ==============================================================================
structs:
  - name: TestStruct
    description: "A test composite struct"
    fields:
      - name: IntField
        type: INT
        constraints:
          - min: 0
          - max: 255
      - name: FloatField
        type: FLOAT
        constraints:
          - min: 0.0f
          - max: 32.5f
      - name: EnumField
        type: ENUM
        constraints:
          - enum: Color
      - name: BytesField
        type: BYTE_ARRAY
        constraints:
          - min_len: 0
          - max_len: 6
      - name: StringField
        type: STRING
        constraints:
          - min_len: 0
          - max_len: 10
      - name: BufField
        type: BUFFER
        constraints:
          - min_len: 0
          - max_len: 16

  - name: NestedStruct
    description: "A struct containing a nested struct field"
    fields:
      - name: Inner
        type: STRUCT
        constraints:
          - struct: TestStruct
      - name: Flag
        type: INT
        constraints:
          - min: 0
          - max: 1

# ==============================================================================
# Roles
# ==============================================================================
roles:
  - Guest
  - Session

# ==============================================================================
# Categories
# ==============================================================================
categories:
  - General

# ==============================================================================
# Items
# ==============================================================================
items:
  - name: TestString
    description: "A test string item"
    categories: [General]
    type: STRING
    storage: PERSISTENT
    permissions:
      - read: ANY
      - write: [Session]
    default: "hello"
    constraints:
      - min_len: 1
      - max_len: 32

  - name: TestInt
    description: "A test int item"
    categories: [General]
    type: INT
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: ANY
    default: 0
    constraints:
      - min: -50
      - max: 50

  - name: TestFloat
    description: "A test float item"
    categories: [General]
    type: FLOAT
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: ANY
    default: 1.0
    constraints:
      - min: 0.0
      - max: 10.0

  - name: TestEnum
    description: "A test enum item"
    categories: [General]
    type: ENUM
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: ANY
    default: RED
    constraints:
      - enum: Color

  - name: TestBytes
    description: "A test byte array item"
    categories: [General]
    type: BYTE_ARRAY
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: ANY
    default: [0x01, 0x02, 0x03, 0x04]
    constraints:
      - min_len: 4
      - max_len: 4

  - name: TestBuffer
    description: "A test buffer item"
    categories: [General]
    type: BUFFER
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: ANY
    default: []
    constraints:
      - min_len: 0
      - max_len: 64

  - name: TestTofu
    description: "A test TOFU item"
    categories: [General]
    type: STRING
    storage: TOFU
    permissions:
      - read: ANY
      - write: [Session]
    default: "default"
    constraints:
      - min_len: 1
      - max_len: 16

  - name: TestReadOnly
    description: "A test read-only item"
    categories: [General]
    type: INT
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: INTERNAL
    default: 42
    constraints:
      - min: 0
      - max: 100

  - name: TestStructItem
    description: "A test struct item"
    categories: [General]
    type: STRUCT
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: ANY
    default:
      - field: IntField
        value: 7
      - field: FloatField
        value: 5.0
      - field: EnumField
        value: GREEN
      - field: BytesField
        value: [0x03, 0x02, 0x01]
      - field: StringField
        value: "Text"
      - field: BufField
        value: []
    constraints:
      - struct: TestStruct

  - name: TestCustomInt
    description: "An int item using custom get/set callbacks"
    categories: [General]
    type: INT
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: ANY
    default: 0
    constraints:
      - min: 0
      - max: 100
    custom_get: test_custom_getter
    custom_set: test_custom_setter

  - name: TestCustomReadOnly
    description: "A read-only int item with custom callbacks"
    categories: [General]
    type: INT
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: INTERNAL
    default: 0
    constraints:
      - min: 0
      - max: 100
    custom_get: test_custom_getter
    custom_set: test_custom_setter

  - name: TestCustomGetterOnly
    description: "An int item with only a custom getter (set still uses interface)"
    categories: [General]
    type: INT
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: ANY
    default: 0
    constraints:
      - min: 0
      - max: 100
    custom_get: test_getter_only

  - name: TestCustomSetterOnly
    description: "An int item with only a custom setter (get still uses interface)"
    categories: [General]
    type: INT
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: ANY
    default: 0
    constraints:
      - min: 0
      - max: 100
    custom_set: test_setter_only

  - name: TestCustomValidated
    description: "An int item with a custom validator that rejects odd values"
    categories: [General]
    type: INT
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: ANY
    default: 0
    constraints:
      - min: 0
      - max: 100
    custom_validate: test_custom_validator

  - name: TestNestedStructItem
    description: "A test nested struct item"
    categories: [General]
    type: STRUCT
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: ANY
    default:
      - field: Inner
        value:
          - field: IntField
            value: 0
          - field: FloatField
            value: 0.0
          - field: EnumField
            value: RED
          - field: BytesField
            value: [0x01, 0x02, 0x03]
          - field: StringField
            value: "Test"
          - field: BufField
            value: []
      - field: Flag
        value: 0
    constraints:
      - struct: NestedStruct
