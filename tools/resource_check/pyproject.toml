[project]
name = "resource-check"
version = "0.1.0"
description = "Finds resources that leak on a return path in C code, driven by @acquires and @releases annotations"
authors = [{ name = "Demizo", email = "demizodemazo@gmail.com" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "tree-sitter>=0.26.0",
    "tree-sitter-c>=0.24.2",
]

[project.scripts]
resource-check = "resource_check.checker:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff==0.15.14",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
