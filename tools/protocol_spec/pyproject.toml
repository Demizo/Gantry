[project]
name = "protocol-spec"
version = "0.1.0"
description = "Checks and renders protocol golden vectors, written as exchanges against a CDDL spec, and the CDDL's wire constants"
authors = [{ name = "Demizo", email = "demizodemazo@gmail.com" }]
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Checking, rendering and exporting vectors; the constants need only the base install
vectors = [
    "cbor-diag>=1.2.0",
    # zcbor 0.9.1 imports names that cbor2 6 removed
    "cbor2>=5.6,<6",
    "zcbor==0.9.1",
]

[project.scripts]
protocol-spec = "protocol_spec.cli:main"

[dependency-groups]
dev = [
    "protocol-spec[vectors]",
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
