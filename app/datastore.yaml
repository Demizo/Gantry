# ==============================================================================
# Enumerations
# ==============================================================================
enums:
  BleConnectionState:
    description: "Bluetooth Connection State"
    values:
      - name: DISCONNECTED
        value: 0
      - name: CONNECTED
        value: 1

  Toggle:
    description: "A toggle to enable or disable"
    values:
      - name: DISABLED
        value: 0
      - name: ENABLED
        value: 1

  SpiChipSelect:
    description: "A SPI chip select index"
    values:
      - name: SPI_CS0
        value: 0
      - name: SPI_CS1
        value: 1

# ==============================================================================
# Categories
# ==============================================================================
categories:
  - System
  - BLE
  - SPI
  - Test

# ==============================================================================
# Structures
# ==============================================================================
structs:
  - name: SpiBuffer
    description: "A SPI buffer containing a chip select and transeive data"
    fields:
      - name: CS
        type: ENUM
        constraints:
          - enum: SpiChipSelect
      - name: Bytes
        type: BYTE_ARRAY
        constraints:
          - min_len: 0
          - max_len: 6
      - name: Text
        type: STRING
        constraints:
          - min_len: 3
          - max_len: 12
      - name: Buffer
        type: BUFFER
        constraints:
          - min_len: 0
          - max_len: 512

# ==============================================================================
# Items
# ==============================================================================
items:
  - name: DeviceName
    description: "The name of the device"
    type: STRING
    storage: PERSISTENT
    permissions:
      - read: ANY
      - write: SESSION
    default: "Gantry"
    constraints:
      - min_len: 3
      - max_len: 25
    categories: [System]

  - name: SerialNumber
    description: "The device serial number"
    type: STRING
    storage: TOFU
    permissions:
      - read: ANY
      - write: SESSION
    default: "0000000000000000"
    constraints:
      - min_len: 16
      - max_len: 16
    categories: [System]

  - name: FirmwareVersion
    description: "The current firmware version"
    type: STRING
    storage: PERSISTENT
    permissions:
      - read: ANY
      - write: NONE
    default: "1.0.0"
    constraints:
      - min_len: 6
      - max_len: 32
    categories: [System]

  - name: BleConnectionState
    description: "The current BLE connection state"
    type: ENUM
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: INTERNAL
    default: DISCONNECTED
    constraints:
      - enum: BleConnectionState
    categories: [System, BLE]

  - name: TestEnum
    description: "Test enum value"
    type: ENUM
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: ANY
    default: DISABLED
    constraints:
      - enum: Toggle
    categories: [Test]

  - name: TestInt
    description: "Test int value"
    type: INT
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: ANY
    default: 0
    constraints:
      - min: -100
      - max: 100
    categories: [Test]

  - name: TestFloat
    description: "Test float value"
    type: FLOAT
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: ANY
    default: 21.5
    constraints:
      - min: 15.0
      - max: 30.0
    categories: [Test]

  - name: TestBytes
    description: "Test bytes"
    type: BYTE_ARRAY
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: ANY
    default: [0xDE, 0xAD, 0xBE, 0xEF, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x01]
    constraints:
      - min_len: 12
      - max_len: 12
    categories: [Test]

  - name: TestBuffer
    description: "Test buffer"
    type: BUFFER
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: ANY
    default: []
    constraints:
      - min_len: 0
      - max_len: 20
    categories: [Test]

  - name: SpiTxBuffer
    description: "SPI TX buffer"
    type: STRUCT
    storage: EPHEMERAL
    permissions:
      - read: ANY
      - write: ANY
    default:
      - field: CS
        value: SPI_CS0
      - field: Bytes
        value: [0x01, 0x02, 0x03]
      - field: Text
        value: "Test"
      - field: Buffer
        value: []
    constraints:
      - struct: SpiBuffer
    categories: [SPI]
