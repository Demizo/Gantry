[project]
name = "stow-client"
version = "0.1.0"
description = "Python implementation of a Grantry Stow client"
authors = [{ name = "Demizo", email = "demizodemazo@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "cbor2>=5.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
integration = [
    "pyserial-asyncio>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
