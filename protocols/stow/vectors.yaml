# Golden vectors of the Stow protocol, recorded against schema.yaml. Format: tools/protocol_spec/README.md.

cddl: stow.cddl
sides:
  client: request
  server: response
values:
  stow_hash: [uv, run, ../../tools/stow/generate_stow.py, --print-hash, --yaml, schema.yaml]

exchanges:
  - name: connect
    meaning: A client connects with Hello, then reads every description from the first item on
    roles: [Guest]
    steps:
      - client: '[0 /hello/, 0]'
      - server: |
          [1 /hello-response/, 0, 1, {
            0: 308,
            1: $stow_hash,
            2: 1,
            3: ["Guest", "Session", "Dev"]
          }]
      - client: '[2 /describe/, 1, 0]'
      - server: |
          [3 /describe-response/, 1, 5, <<
            {0: 0, 1: "StowHash", 2: [], 3: 0, 4: 65535, 5: 0, 6: 3, 7: $stow_hash, 8: {0: 64, 1: 64}},
            {0: 1, 1: "TestInt", 2: ["General"], 3: 0, 4: 65535, 5: 65535, 6: 1, 7: 0, 8: {0: -100, 1: 100}},
            {0: 2, 1: "TestString", 2: ["General"], 3: 0, 4: 65535, 5: 2, 6: 3, 7: "hello", 8: {0: 0, 1: 32}},
            {0: 3, 1: "TestSessionInt", 2: ["General"], 3: 0, 4: 2, 5: 2, 6: 1, 7: 7, 8: {0: 0, 1: 1000}},
            {0: 4, 1: "TestDevInt", 2: ["General"], 3: 0, 4: 4, 5: 4, 6: 1, 7: 99, 8: {0: 0, 1: 9999}}
          >>]
      - client: '[2 /describe/, 2, 5]'
      - server: |
          [3 /describe-response/, 2, 10, <<
            {0: 5, 1: "TestBuffer", 2: ["General"], 3: 0, 4: 65535, 5: 65535, 6: 5, 7: h'', 8: {0: 0, 1: 16}},
            {0: 6, 1: "TestTofu", 2: ["General"], 3: 2, 4: 65535, 5: 65535, 6: 3, 7: "", 8: {0: 0, 1: 16}},
            {0: 7, 1: "TestLongString", 2: ["General"], 3: 0, 4: 65535, 5: 65535, 6: 3, 7: "", 8: {0: 0, 1: 400}},
            {0: 8, 1: "TestFloat", 2: ["General"], 3: 0, 4: 65535, 5: 65535, 6: 2, 7: 21.5_2, 8: {0: 15.0_2, 1: 30.0_2}},
            {0: 9, 1: "TestEnum", 2: ["General"], 3: 0, 4: 65535, 5: 65535, 6: 0, 7: 0, 8: [{0: 0, 1: "OFF"}, {0: 1, 1: "ON"}]}
          >>]
      - client: '[2 /describe/, 3, 10]'
      - server: |
          [3 /describe-response/, 3, null, <<
            {0: 10, 1: "TestBytes", 2: ["General"], 3: 0, 4: 65535, 5: 65535, 6: 4, 7: h'01020304', 8: {0: 4, 1: 4}},
            {0: 11, 1: "TestRecord", 2: ["General"], 3: 0, 4: 65535, 5: 65535, 6: 6, 7: [0, h''], 8: [
              {0: "Count", 1: 1, 2: {0: 0, 1: 10}},
              {0: "Data", 1: 5, 2: {0: 0, 1: 4}}
            ]}
          >>]

  - name: hello
    meaning: Hello reports the version, the largest message, the StowHash and the session's roles
    roles: [Guest, Dev]
    steps:
      - client: '[0 /hello/, 12]'
      - server: |
          [1 /hello-response/, 12, 1, {
            0: 308,
            1: $stow_hash,
            2: 5,
            3: ["Guest", "Session", "Dev"]
          }]

  - name: describe_filtered
    meaning: Describe with names returns only the known named items
    roles: [Guest]
    steps:
      - client: '[2 /describe/, 16, 0, ["TestInt", "NoSuchItem"]]'
      - server: |
          [3 /describe-response/, 16, null, <<
            {0: 1, 1: "TestInt", 2: ["General"], 3: 0, 4: 65535, 5: 65535, 6: 1, 7: 0, 8: {0: -100, 1: 100}}
          >>]

  - name: describe_types
    meaning: Describe of Enum, Byte Array and Struct items gives each type's default and constraints
    roles: [Guest]
    steps:
      - client: '[2 /describe/, 13, 0, ["TestEnum", "TestBytes", "TestRecord"]]'
      - server: |
          [3 /describe-response/, 13, null, <<
            {0: 9, 1: "TestEnum", 2: ["General"], 3: 0, 4: 65535, 5: 65535, 6: 0, 7: 0, 8: [{0: 0, 1: "OFF"}, {0: 1, 1: "ON"}]},
            {0: 10, 1: "TestBytes", 2: ["General"], 3: 0, 4: 65535, 5: 65535, 6: 4, 7: h'01020304', 8: {0: 4, 1: 4}},
            {0: 11, 1: "TestRecord", 2: ["General"], 3: 0, 4: 65535, 5: 65535, 6: 6, 7: [0, h''], 8: [
              {0: "Count", 1: 1, 2: {0: 0, 1: 10}},
              {0: "Data", 1: 5, 2: {0: 0, 1: 4}}
            ]}
          >>]

  - name: describe_invalid_start
    meaning: Describe from an item ID past the last item is INVALID_ITEM
    roles: [Guest]
    steps:
      - client: '[2 /describe/, 18, 100]'
      - server: '[11 /error/, 18, 3 /invalid-item/, 100]'

  - name: get_int
    meaning: Get returns the item's value
    roles: [Guest]
    steps:
      - client: '[4 /get/, 2, 1 /TestInt/]'
      - server: '[5 /get-response/, 2, 1 /TestInt/, 0]'

  - name: get_float
    meaning: Get of a Float item returns a float32 value
    roles: [Guest]
    steps:
      - client: '[4 /get/, 21, 8 /TestFloat/]'
      - server: '[5 /get-response/, 21, 8 /TestFloat/, 21.5_2]'

  - name: get_several
    meaning: Get with several items returns each item and value in order
    roles: [Guest]
    steps:
      - client: '[4 /get/, 7, 1 /TestInt/, 2 /TestString/]'
      - server: '[5 /get-response/, 7, 1 /TestInt/, 0, 2 /TestString/, "hello"]'

  - name: get_permission_denied
    meaning: Get of an item the session cannot read names the item
    roles: [Guest]
    steps:
      - client: '[4 /get/, 3, 3 /TestSessionInt/]'
      - server: '[11 /error/, 3, 5 /permission-denied/, 3, 0]'

  - name: get_after_set
    meaning: Get returns the value a Set stored
    roles: [Guest]
    steps:
      - client: '[6 /set/, 3, 5 /TestBuffer/, h''0102'']'
      - server: '[10 /ok/, 3]'
      - client: '[4 /get/, 4, 5 /TestBuffer/]'
      - server: '[5 /get-response/, 4, 5 /TestBuffer/, h''0102'']'

  - name: set_int
    meaning: Set answers OK with the request tag
    roles: [Guest]
    steps:
      - client: '[6 /set/, 4, 1 /TestInt/, 5]'
      - server: '[10 /ok/, 4]'

  - name: set_float
    meaning: Set of a Float item carries a float32 value
    roles: [Guest]
    steps:
      - client: '[6 /set/, 22, 8 /TestFloat/, 22.25_2]'
      - server: '[10 /ok/, 22]'

  - name: set_several
    meaning: Set with several items applies every entry and answers OK
    roles: [Guest]
    steps:
      - client: '[6 /set/, 17, 1 /TestInt/, 5, 9 /TestEnum/, 1]'
      - server: '[10 /ok/, 17]'

  - name: set_unknown_item
    meaning: An unknown item ID is INVALID_ITEM and names the ID
    roles: [Guest]
    steps:
      - client: '[6 /set/, 6, 99, 1]'
      - server: '[11 /error/, 6, 3 /invalid-item/, 99, 0]'

  - name: set_invalid_value
    meaning: A value outside the item's constraints is INVALID_VALUE
    roles: [Guest]
    steps:
      - client: '[6 /set/, 5, 1 /TestInt/, 500]'
      - server: '[11 /error/, 5, 7 /invalid-value/, 1, 0]'

  - name: set_partial
    meaning: A failing Set entry is named by item and index; the entries before it took effect
    roles: [Guest]
    steps:
      - client: '[6 /set/, 8, 1 /TestInt/, 5, 8 /TestFloat/, 99.0_2]'
      - server: '[11 /error/, 8, 7 /invalid-value/, 8, 1]'
      - client: '[4 /get/, 9, 1 /TestInt/]'
      - server: '[5 /get-response/, 9, 1 /TestInt/, 5]'

  - name: set_already_set
    meaning: A trust-on-first-use item that is already set is ALREADY_SET
    roles: [Guest]
    steps:
      - client: '[6 /set/, 1, 6 /TestTofu/, "first"]'
      - server: '[10 /ok/, 1]'
      - client: '[6 /set/, 19, 6 /TestTofu/, "second"]'
      - server: '[11 /error/, 19, 8 /already-set/, 6, 0]'

  - name: subscribe_several
    meaning: Subscribe accepts several items
    roles: [Session]
    steps:
      - client: '[7 /subscribe/, 9, 1 /TestInt/, 3 /TestSessionInt/]'
      - server: '[10 /ok/, 9]'

  - name: update_after_set
    meaning: A subscribed session gets an Update with the new value, after the Set's OK
    roles: [Guest]
    steps:
      - client: '[7 /subscribe/, 3, 1 /TestInt/]'
      - server: '[10 /ok/, 3]'
      - client: '[6 /set/, 4, 1 /TestInt/, 42]'
      - server: '[10 /ok/, 4]'
      - server: '[9 /update/, null, 1 /TestInt/, 42]'

  - name: unsubscribe
    meaning: Unsubscribe is idempotent
    roles: [Guest]
    steps:
      - client: '[8 /unsubscribe/, 10, 1 /TestInt/]'
      - server: '[10 /ok/, 10]'

  - name: no_update_after_unsubscribe
    meaning: After Unsubscribe, a Set of the item sends no Update
    roles: [Guest]
    steps:
      - client: '[7 /subscribe/, 5, 1 /TestInt/]'
      - server: '[10 /ok/, 5]'
      - client: '[8 /unsubscribe/, 6, 1 /TestInt/]'
      - server: '[10 /ok/, 6]'
      - client: '[6 /set/, 7, 1 /TestInt/, 9]'
      - server: '[10 /ok/, 7]'

  - name: tag_max
    meaning: The largest tag, 23, is echoed
    roles: [Guest]
    steps:
      - client: '[8 /unsubscribe/, 23, 1 /TestInt/]'
      - server: '[10 /ok/, 23]'

malformed:
  - name: get_empty
    meaning: Get without items is malformed
    roles: [Guest]
    steps:
      - client: '[4 /get/, 16]'
      - server: '[11 /error/, 16, 1 /malformed-msg/]'

  - name: set_empty
    meaning: Set without items is malformed
    roles: [Guest]
    steps:
      - client: '[6 /set/, 17]'
      - server: '[11 /error/, 17, 1 /malformed-msg/]'

  - name: subscribe_empty
    meaning: Subscribe without items is malformed
    roles: [Guest]
    steps:
      - client: '[7 /subscribe/, 14]'
      - server: '[11 /error/, 14, 1 /malformed-msg/]'

  - name: unsubscribe_empty
    meaning: Unsubscribe without items is malformed
    roles: [Guest]
    steps:
      - client: '[8 /unsubscribe/, 18]'
      - server: '[11 /error/, 18, 1 /malformed-msg/]'

  - name: tag_out_of_range
    meaning: A tag above 23 is malformed and answered with a null tag
    roles: [Guest]
    steps:
      - client: '[0 /hello/, 24]'
      - server: '[11 /error/, null, 1 /malformed-msg/]'

  - name: unknown_message
    meaning: An unknown message code is UNKNOWN_MSG with the request tag
    roles: [Guest]
    steps:
      - client: '[99, 11]'
      - server: '[11 /error/, 11, 2 /unknown-msg/]'

  - name: trailing_bytes
    meaning: Bytes after the message make it malformed
    roles: [Guest]
    steps:
      - client: '[0 /hello/, 15], 0'
      - server: '[11 /error/, 15, 1 /malformed-msg/]'

  - name: malformed
    meaning: An undecodable request is answered with a null tag
    roles: [Guest]
    steps:
      - client_hex: ff
      - server: '[11 /error/, null, 1 /malformed-msg/]'
