# Golden vectors of the Stow protocol, recorded against stow.yaml. Format: tools/protocol_spec/README.md.

cddl: stow.cddl
sides:
  client: request
  server: response
values:
  stow_hash: [stow-gen, hash, --yaml, stow.yaml]

exchanges:
  - name: connect
    meaning: A client connects with Hello, then reads every description from the first item on
    roles: [Guest]
    steps:
      - client: '[0 /hello/, 0]'
      - server: |
          [1 /hello-response/, 0, 1, {
            0: 308,
            1: $stow_hash,
            2: 1,
            3: ["Guest", "Session", "Dev"]
          }]
      - client: '[2 /describe/, 1, 0]'
      - server: |
          [3 /describe-response/, 1, 5, <<
            {0: 0, 1: "StowHash", 2: [], 3: 0, 4: 65535, 5: 0, 6: 3, 7: $stow_hash, 8: {0: 64, 1: 64}},
            {0: 1, 1: "TestInt", 2: ["General"], 3: 0, 4: 65535, 5: 65535, 6: 1, 7: 0, 8: {0: -100, 1: 100}},
            {0: 2, 1: "TestString", 2: ["General"], 3: 0, 4: 65535, 5: 2, 6: 3, 7: "hello", 8: {0: 0, 1: 32}},
            {0: 3, 1: "TestSessionInt", 2: ["General"], 3: 0, 4: 2, 5: 2, 6: 1, 7: 7, 8: {0: 0, 1: 1000}},
            {0: 4, 1: "TestDevInt", 2: ["General"], 3: 0, 4: 4, 5: 4, 6: 1, 7: 99, 8: {0: 0, 1: 9999}}
          >>]
      - client: '[2 /describe/, 2, 5]'
      - server: |
          [3 /describe-response/, 2, 10, <<
            {0: 5, 1: "TestBuffer", 2: ["General"], 3: 0, 4: 65535, 5: 65535, 6: 5, 7: h'', 8: {0: 0, 1: 16}},
            {0: 6, 1: "TestTofu", 2: ["General"], 3: 2, 4: 65535, 5: 65535, 6: 3, 7: "", 8: {0: 0, 1: 16}},
            {0: 7, 1: "TestLongString", 2: ["General"], 3: 0, 4: 65535, 5: 65535, 6: 3, 7: "", 8: {0: 0, 1: 400}},
            {0: 8, 1: "TestFloat", 2: ["General"], 3: 0, 4: 65535, 5: 65535, 6: 2, 7: 21.5_2, 8: {0: 15.0_2, 1: 30.0_2}},
            {0: 9, 1: "TestEnum", 2: ["General"], 3: 0, 4: 65535, 5: 65535, 6: 0, 7: 0, 8: [{0: 0, 1: "OFF"}, {0: 1, 1: "ON"}]}
          >>]
      - client: '[2 /describe/, 3, 10]'
      - server: |
          [3 /describe-response/, 3, null, <<
            {0: 10, 1: "TestBytes", 2: ["General"], 3: 0, 4: 65535, 5: 65535, 6: 4, 7: h'01020304', 8: {0: 4, 1: 4}},
            {0: 11, 1: "TestRecord", 2: ["General"], 3: 0, 4: 65535, 5: 65535, 6: 6, 7: [0, h''], 8: [
              {0: "Count", 1: 1, 2: {0: 0, 1: 10}},
              {0: "Data", 1: 5, 2: {0: 0, 1: 4}}
            ]},
            {0: 12, 1: "TestNestedRecord", 2: ["General"], 3: 0, 4: 65535, 5: 65535, 6: 6, 7: [[0, h''], 0], 8: [
              {0: "Pair", 1: 6, 2: [
                {0: "Count", 1: 1, 2: {0: 0, 1: 10}},
                {0: "Data", 1: 5, 2: {0: 0, 1: 4}}
              ]},
              {0: "Flag", 1: 1, 2: {0: 0, 1: 1}}
            ]}
          >>]

  - name: hello
    meaning: Hello reports the version, the largest message, the StowHash and the session's roles
    roles: [Guest, Dev]
    steps:
      - client: '[0 /hello/, 12]'
      - server: |
          [1 /hello-response/, 12, 1, {
            0: 308,
            1: $stow_hash,
            2: 5,
            3: ["Guest", "Session", "Dev"]
          }]

  - name: describe_filtered
    meaning: Describe with names returns only the known named items
    roles: [Guest]
    steps:
      - client: '[2 /describe/, 16, 0, ["TestInt", "NoSuchItem"]]'
      - server: |
          [3 /describe-response/, 16, null, <<
            {0: 1, 1: "TestInt", 2: ["General"], 3: 0, 4: 65535, 5: 65535, 6: 1, 7: 0, 8: {0: -100, 1: 100}}
          >>]

  - name: describe_types
    meaning: Describe of Enum, Byte Array and Struct items gives each type's default and constraints
    roles: [Guest]
    steps:
      - client: '[2 /describe/, 13, 0, ["TestEnum", "TestBytes", "TestRecord"]]'
      - server: |
          [3 /describe-response/, 13, null, <<
            {0: 9, 1: "TestEnum", 2: ["General"], 3: 0, 4: 65535, 5: 65535, 6: 0, 7: 0, 8: [{0: 0, 1: "OFF"}, {0: 1, 1: "ON"}]},
            {0: 10, 1: "TestBytes", 2: ["General"], 3: 0, 4: 65535, 5: 65535, 6: 4, 7: h'01020304', 8: {0: 4, 1: 4}},
            {0: 11, 1: "TestRecord", 2: ["General"], 3: 0, 4: 65535, 5: 65535, 6: 6, 7: [0, h''], 8: [
              {0: "Count", 1: 1, 2: {0: 0, 1: 10}},
              {0: "Data", 1: 5, 2: {0: 0, 1: 4}}
            ]}
          >>]

  - name: describe_invalid_start
    meaning: Describe from an item ID past the last item is INVALID_ITEM
    roles: [Guest]
    steps:
      - client: '[2 /describe/, 18, 100]'
      - server: '[11 /error/, 18, 3 /invalid-item/, 100]'

  - name: describe_no_known_names
    meaning: Describe with names that are all unknown returns an empty chunk
    roles: [Guest]
    steps:
      - client: '[2 /describe/, 14, 0, ["NoSuchItem"]]'
      - server: '[3 /describe-response/, 14, null, h'''']'

  - name: get_int
    meaning: Get returns the item's value
    roles: [Guest]
    steps:
      - client: '[4 /get/, 2, 1 /TestInt/]'
      - server: '[5 /get-response/, 2, 1 /TestInt/, 0]'

  - name: get_float
    meaning: Get of a Float item returns a float32 value
    roles: [Guest]
    steps:
      - client: '[4 /get/, 21, 8 /TestFloat/]'
      - server: '[5 /get-response/, 21, 8 /TestFloat/, 21.5_2]'

  - name: get_several
    meaning: Get with several items returns each item and value in order
    roles: [Guest]
    steps:
      - client: '[4 /get/, 7, 1 /TestInt/, 2 /TestString/]'
      - server: '[5 /get-response/, 7, 1 /TestInt/, 0, 2 /TestString/, "hello"]'

  - name: get_permission_denied
    meaning: Get of an item the session cannot read names the item
    roles: [Guest]
    steps:
      - client: '[4 /get/, 3, 3 /TestSessionInt/]'
      - server: '[11 /error/, 3, 5 /permission-denied/, 3, 0]'

  - name: get_failure_names_entry
    meaning: A failing Get entry is named by item and index
    roles: [Guest]
    steps:
      - client: '[4 /get/, 12, 1 /TestInt/, 2 /TestString/, 4 /TestDevInt/]'
      - server: '[11 /error/, 12, 5 /permission-denied/, 4, 2]'

  - name: get_unknown_item
    meaning: Get of an unknown item ID is INVALID_ITEM and names the ID
    roles: [Guest]
    steps:
      - client: '[4 /get/, 11, 99]'
      - server: '[11 /error/, 11, 3 /invalid-item/, 99, 0]'

  - name: get_after_set
    meaning: Get returns the value a Set stored
    roles: [Guest]
    steps:
      - client: '[6 /set/, 3, 5 /TestBuffer/, h''0102'']'
      - server: '[10 /ok/, 3]'
      - client: '[4 /get/, 4, 5 /TestBuffer/]'
      - server: '[5 /get-response/, 4, 5 /TestBuffer/, h''0102'']'

  - name: get_after_set_nested
    meaning: A Struct item with a Struct field is set and read back
    roles: [Guest]
    steps:
      - client: '[6 /set/, 5, 12 /TestNestedRecord/, [[3, h''01''], 1]]'
      - server: '[10 /ok/, 5]'
      - client: '[4 /get/, 6, 12 /TestNestedRecord/]'
      - server: '[5 /get-response/, 6, 12 /TestNestedRecord/, [[3, h''01''], 1]]'

  - name: get_after_set_string
    meaning: A String item is set and read back
    roles: [Session]
    steps:
      - client: '[6 /set/, 13, 2 /TestString/, "newval"]'
      - server: '[10 /ok/, 13]'
      - client: '[4 /get/, 14, 2 /TestString/]'
      - server: '[5 /get-response/, 14, 2 /TestString/, "newval"]'

  - name: set_int
    meaning: Set answers OK with the request tag
    roles: [Guest]
    steps:
      - client: '[6 /set/, 4, 1 /TestInt/, 5]'
      - server: '[10 /ok/, 4]'

  - name: set_float
    meaning: Set of a Float item carries a float32 value
    roles: [Guest]
    steps:
      - client: '[6 /set/, 22, 8 /TestFloat/, 22.25_2]'
      - server: '[10 /ok/, 22]'

  - name: set_several
    meaning: Set with several items applies every entry and answers OK
    roles: [Guest]
    steps:
      - client: '[6 /set/, 17, 1 /TestInt/, 5, 9 /TestEnum/, 1]'
      - server: '[10 /ok/, 17]'

  - name: set_same_item_twice
    meaning: Set applies its entries in order, so the last one for an item wins
    roles: [Guest]
    steps:
      - client: '[6 /set/, 10, 1 /TestInt/, 10, 1 /TestInt/, 20]'
      - server: '[10 /ok/, 10]'
      - client: '[4 /get/, 11, 1 /TestInt/]'
      - server: '[5 /get-response/, 11, 1 /TestInt/, 20]'

  - name: set_permission_denied
    meaning: Set of an item the session cannot write names the item
    roles: [Guest]
    steps:
      - client: '[6 /set/, 15, 2 /TestString/, "denied"]'
      - server: '[11 /error/, 15, 5 /permission-denied/, 2, 0]'

  - name: set_unknown_item
    meaning: An unknown item ID is INVALID_ITEM and names the ID
    roles: [Guest]
    steps:
      - client: '[6 /set/, 6, 99, 1]'
      - server: '[11 /error/, 6, 3 /invalid-item/, 99, 0]'

  - name: set_invalid_value
    meaning: A value outside the item's constraints is INVALID_VALUE
    roles: [Guest]
    steps:
      - client: '[6 /set/, 5, 1 /TestInt/, 500]'
      - server: '[11 /error/, 5, 7 /invalid-value/, 1, 0]'

  - name: set_invalid_struct
    meaning: A Struct value with a field outside its constraints is INVALID_VALUE and names the item
    roles: [Guest]
    steps:
      - client: '[6 /set/, 1, 11 /TestRecord/, [50, h'''']]'
      - server: '[11 /error/, 1, 7 /invalid-value/, 11]'

  - name: set_partial
    meaning: A failing Set entry is named by item and index; the entries before it took effect
    roles: [Guest]
    steps:
      - client: '[6 /set/, 8, 1 /TestInt/, 5, 8 /TestFloat/, 99.0_2]'
      - server: '[11 /error/, 8, 7 /invalid-value/, 8, 1]'
      - client: '[4 /get/, 9, 1 /TestInt/]'
      - server: '[5 /get-response/, 9, 1 /TestInt/, 5]'

  - name: set_partial_unknown_item
    meaning: An unknown item ID in a Set is named by ID and index; the entries before it took effect
    roles: [Guest]
    steps:
      - client: '[6 /set/, 12, 1 /TestInt/, 12, 13, 1]'
      - server: '[11 /error/, 12, 3 /invalid-item/, 13, 1]'
      - client: '[4 /get/, 13, 1 /TestInt/]'
      - server: '[5 /get-response/, 13, 1 /TestInt/, 12]'

  - name: set_mistyped_value
    meaning: A Set value of the wrong type is MALFORMED and names its item; no entry takes effect
    roles: [Guest]
    steps:
      - client: '[6 /set/, 14, 1 /TestInt/, 14, 3 /TestSessionInt/, "x"]'
      - server: '[11 /error/, 14, 1 /malformed-msg/, 3]'
      - client: '[4 /get/, 15, 1 /TestInt/]'
      - server: '[5 /get-response/, 15, 1 /TestInt/, 0]'

  - name: set_already_set
    meaning: A trust-on-first-use item that is already set is ALREADY_SET
    roles: [Guest]
    steps:
      - client: '[6 /set/, 1, 6 /TestTofu/, "first"]'
      - server: '[10 /ok/, 1]'
      - client: '[6 /set/, 19, 6 /TestTofu/, "second"]'
      - server: '[11 /error/, 19, 8 /already-set/, 6, 0]'

  - name: subscribe_partial
    meaning: A failing Subscribe entry is named by item and index; only the entries before it took effect
    roles: [Guest]
    steps:
      - client: '[7 /subscribe/, 4, 1 /TestInt/, 3 /TestSessionInt/, 9 /TestEnum/]'
      - server: '[11 /error/, 4, 5 /permission-denied/, 3, 1]'
      - client: '[6 /set/, 5, 1 /TestInt/, 4, 9 /TestEnum/, 1]'
      - server: '[10 /ok/, 5]'
      - server: '[9 /update/, null, 1 /TestInt/, 4]'

  - name: update_after_set
    meaning: A subscribed session gets an Update with the new value, after the Set's OK
    roles: [Guest]
    steps:
      - client: '[7 /subscribe/, 3, 1 /TestInt/]'
      - server: '[10 /ok/, 3]'
      - client: '[6 /set/, 4, 1 /TestInt/, 42]'
      - server: '[10 /ok/, 4]'
      - server: '[9 /update/, null, 1 /TestInt/, 42]'

  - name: resubscribe
    meaning: Subscribing to an item twice still sends one Update per change
    roles: [Guest]
    steps:
      - client: '[7 /subscribe/, 1, 1 /TestInt/]'
      - server: '[10 /ok/, 1]'
      - client: '[7 /subscribe/, 2, 1 /TestInt/]'
      - server: '[10 /ok/, 2]'
      - client: '[6 /set/, 3, 1 /TestInt/, 4]'
      - server: '[10 /ok/, 3]'
      - server: '[9 /update/, null, 1 /TestInt/, 4]'

  - name: unsubscribe
    meaning: Unsubscribe is idempotent
    roles: [Guest]
    steps:
      - client: '[8 /unsubscribe/, 10, 1 /TestInt/]'
      - server: '[10 /ok/, 10]'

  - name: no_update_after_unsubscribe
    meaning: After Unsubscribe, a Set of the item sends no Update
    roles: [Guest]
    steps:
      - client: '[7 /subscribe/, 5, 1 /TestInt/]'
      - server: '[10 /ok/, 5]'
      - client: '[8 /unsubscribe/, 6, 1 /TestInt/]'
      - server: '[10 /ok/, 6]'
      - client: '[6 /set/, 7, 1 /TestInt/, 9]'
      - server: '[10 /ok/, 7]'

  - name: unsubscribe_several
    meaning: Updates come for every item a Subscribe names, and stop for every item an Unsubscribe names
    roles: [Session]
    steps:
      - client: '[7 /subscribe/, 6, 1 /TestInt/, 3 /TestSessionInt/]'
      - server: '[10 /ok/, 6]'
      - client: '[6 /set/, 7, 1 /TestInt/, 3, 3 /TestSessionInt/, 3]'
      - server: '[10 /ok/, 7]'
      - server: '[9 /update/, null, 1 /TestInt/, 3]'
      - server: '[9 /update/, null, 3 /TestSessionInt/, 3]'
      - client: '[8 /unsubscribe/, 8, 1 /TestInt/, 3 /TestSessionInt/]'
      - server: '[10 /ok/, 8]'
      - client: '[6 /set/, 9, 1 /TestInt/, 4, 3 /TestSessionInt/, 4]'
      - server: '[10 /ok/, 9]'

  - name: tag_max
    meaning: The largest tag, 23, is echoed
    roles: [Guest]
    steps:
      - client: '[8 /unsubscribe/, 23, 1 /TestInt/]'
      - server: '[10 /ok/, 23]'

malformed:
  - name: get_empty
    meaning: Get without items is malformed
    roles: [Guest]
    steps:
      - client: '[4 /get/, 16]'
      - server: '[11 /error/, 16, 1 /malformed-msg/]'

  - name: set_empty
    meaning: Set without items is malformed
    roles: [Guest]
    steps:
      - client: '[6 /set/, 17]'
      - server: '[11 /error/, 17, 1 /malformed-msg/]'

  - name: subscribe_empty
    meaning: Subscribe without items is malformed
    roles: [Guest]
    steps:
      - client: '[7 /subscribe/, 14]'
      - server: '[11 /error/, 14, 1 /malformed-msg/]'

  - name: unsubscribe_empty
    meaning: Unsubscribe without items is malformed
    roles: [Guest]
    steps:
      - client: '[8 /unsubscribe/, 18]'
      - server: '[11 /error/, 18, 1 /malformed-msg/]'

  - name: tag_out_of_range
    meaning: A tag above 23 is malformed and answered with a null tag
    roles: [Guest]
    steps:
      - client: '[0 /hello/, 24]'
      - server: '[11 /error/, null, 1 /malformed-msg/]'

  - name: tag_not_uint
    meaning: A tag that isn't a uint is malformed and answered with a null tag
    roles: [Guest]
    steps:
      - client: '[0 /hello/, -1]'
      - server: '[11 /error/, null, 1 /malformed-msg/]'

  - name: unknown_message
    meaning: An unknown message code is UNKNOWN_MSG with the request tag
    roles: [Guest]
    steps:
      - client: '[99, 11]'
      - server: '[11 /error/, 11, 2 /unknown-msg/]'

  - name: describe_malformed_before_unknown_start
    meaning: A Describe that is malformed is MALFORMED, even when its start item is unknown
    roles: [Guest]
    steps:
      - client: '[2 /describe/, 20, 100, [1]]'
      - server: '[11 /error/, 20, 1 /malformed-msg/]'

  - name: response_sent_to_server
    meaning: A response sent to a server is UNKNOWN_MSG with its tag, whatever follows the tag
    roles: [Guest]
    steps:
      - client: '[1 /hello-response/, 6]'
      - server: '[11 /error/, 6, 2 /unknown-msg/]'

  - name: update_sent_to_server
    meaning: An Update sent to a server with a tag is UNKNOWN_MSG with that tag
    roles: [Guest]
    steps:
      - client: '[9 /update/, 7, 1 /TestInt/, 5]'
      - server: '[11 /error/, 7, 2 /unknown-msg/]'

  - name: error_sent_to_server
    meaning: A message with a null tag sent to a server is MALFORMED with a null tag, even when it isn't a request
    roles: [Guest]
    steps:
      - client: '[11 /error/, null, 1 /malformed-msg/]'
      - server: '[11 /error/, null, 1 /malformed-msg/]'

  - name: set_malformed_after_invalid_value
    meaning: A Set that is malformed after a value that breaks its constraints is MALFORMED
    roles: [Guest]
    steps:
      - client: '[6 /set/, 1, 11 /TestRecord/, [50, h''''], 1 /TestInt/]'
      - server: '[11 /error/, 1, 1 /malformed-msg/, 1]'

  - name: set_trailing_after_invalid_value
    meaning: A Set with trailing bytes after a value that breaks its constraints is MALFORMED
    roles: [Guest]
    steps:
      - client: '[6 /set/, 2, 11 /TestRecord/, [50, h'''']], 0'
      - server: '[11 /error/, 2, 1 /malformed-msg/]'

  - name: trailing_bytes
    meaning: Bytes after the message make it malformed
    roles: [Guest]
    steps:
      - client: '[0 /hello/, 15], 0'
      - server: '[11 /error/, 15, 1 /malformed-msg/]'

  - name: set_trailing_bytes
    meaning: A Set with bytes after it is MALFORMED, and no entry takes effect
    roles: [Guest]
    steps:
      - client: '[6 /set/, 17, 1 /TestInt/, 21, 1 /TestInt/, 22], 0'
      - server: '[11 /error/, 17, 1 /malformed-msg/]'
      - client: '[4 /get/, 18, 1 /TestInt/]'
      - server: '[5 /get-response/, 18, 1 /TestInt/, 0]'

  - name: set_unterminated
    meaning: A Set whose indefinite-length array never ends is MALFORMED, and no entry takes effect
    roles: [Guest]
    steps:
      - client_hex: 9f0611010a010b
      - server: '[11 /error/, 17, 1 /malformed-msg/]'
      - client: '[4 /get/, 18, 1 /TestInt/]'
      - server: '[5 /get-response/, 18, 1 /TestInt/, 0]'

  - name: malformed
    meaning: An undecodable request is answered with a null tag
    roles: [Guest]
    steps:
      - client_hex: ff
      - server: '[11 /error/, null, 1 /malformed-msg/]'
