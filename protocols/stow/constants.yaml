# The names stow.cddl's integers take in C and in the Python client. Format: tools/protocol_spec/README.md.

cddl: stow.cddl
constants:
  protocol-version: {c: STOW_PROTOCOL_VERSION, python: stow_client.PROTOCOL_VERSION}
  tag: {c: STOW_TAG_MAX, bound: max, python: stow_client.messages.TAG_MAX}
  msg-: {c_enum: stow_message_code, c_prefix: STOW_MSG_, c_count: STOW_MSG_COUNT, python: stow_client.Message}
  err-: {c_enum: stow_error_code, c_prefix: STOW_ERR_, python: stow_client.ErrorCode}
  hello-: {c_enum: stow_hello_key, c_prefix: STOW_HELLO_, python: stow_client.HelloKey}
  desc-: {c_enum: stow_describe_key, c_prefix: STOW_DESCRIBE_, python: stow_client.DescribeKey}
  type-: {c_enum: stow_item_type, c_prefix: STOW_ITEM_TYPE_, c_count: STOW_ITEM_TYPE_COUNT, python: stow_client.ItemType}
  storage-: {c_enum: stow_storage_type, c_prefix: STOW_STORAGE_, python: stow_client.Storage}
  constraint-: {c_enum: stow_constraint_key, c_prefix: STOW_CONSTRAINT_, python: stow_client.ConstraintKey}
  enum-: {c_enum: stow_enum_constraint_key, c_prefix: STOW_ENUM_CONSTRAINT_, python: stow_client.EnumConstraintKey}
  field-: {c_enum: stow_field_constraint_key, c_prefix: STOW_FIELD_CONSTRAINT_, python: stow_client.FieldConstraintKey}
